name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: 'platform-tools'
      cache-disabled: true

  - name: Cache Android SDK
    uses: actions/cache@v4
    with:
      path: ~/.android/sdk
      key: android-sdk-${{ hashFiles('**/build.gradle*', '**/gradle.properties') }}
      restore-keys: |
        android-sdk-

  - name: Configure Gradle Timeouts
    run: |
      mkdir -p ~/.gradle
      echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> ~/.gradle/gradle.properties
      echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> ~/.gradle/gradle.properties

  - name: Install API 36 Platform
    run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

  - name: Make gradlew executable
    run: chmod +x ./gradlew

  - name: Build Debug APK
    run: ./gradlew assembleDebug
